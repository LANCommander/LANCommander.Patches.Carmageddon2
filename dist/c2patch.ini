; c2patch for Carmageddon II (GOG CARMA2_HW.EXE). Install: copy dinput.dll and this file
; next to CARMA2_HW.EXE. Uninstall: delete them. c2patch.log shows what was applied.
; As a LANCommander Interposer plugin: put c2patch.dll in .interposer\Plugins\. The settings below
; then live in .interposer\Config.yml under Plugins: c2patch: (written on the first run); a
; c2patch.ini next to c2patch.dll, if present, overrides them.

[General]
Enabled=1

[Render]
; Track columns (scenery and objects in them) are drawn out to Yon * YonFactor. The graphics
; menu offers 1.0 / 0.5 / 0.25 / 0.125; this is the lowest value it will be allowed to set.
; 0 = don't touch.
MinYonFactor=1.0
; Lowest far-clip distance (OPTIONS.TXT "Yon"; the menu goes 20..35, the game floor is 5).
; 0 = don't touch. Higher values show more of the track but cost frame rate.
MinYon=0
; Moving scenery (gates, doors, lifts, ...) normally stops animating when it is out of view,
; and keeps colliding wherever it stopped. 1 = always animate.
AnimateAllGrooves=1

[Net]
; Fixes a crash in network games with 8 or more players: when 8 cars take crush damage in the
; same frame, the game's damage list loses its end marker and the game reads garbage.
FixCrushListOverflow=1
; How often this machine sends car positions, in ms. The game simulates in 40 ms steps, so:
; 40 = 25 updates/s, 80 = 12.5/s (the original), 120 = 8.3/s. Faster is smoother but uses more
; bandwidth; the host's setting decides how often everyone sees the other players. Also on the
; NET GAME OPTIONS screen as UPDATE RATE (25 HZ / 12 HZ / 8 HZ), which saves here.
SendIntervalMs=80
; 0 hides the UPDATE RATE row from NET GAME OPTIONS.
UpdateRateMenu=1
; The original game also resends unchanged car data on frames where no new 40 ms simulation step
; has happened, which at modern frame rates more than doubles the traffic (about 30 packets/s
; at 60 fps for 12.5 real updates). 1 = skip those duplicates.
SkipDuplicateSends=1

[Player]
; Longest driver name you can type (the original allows 8). 13 is the most the game's save
; files and memory layout can hold.
MaxNameLength=13

[AI]
; Opponents more than ~45 units from you for 3 s stop being simulated: they are hidden and slid
; along the path network without collision, then rematerialise when you get close (which is how
; they end up stuck behind barriers). 0 = opponents always use full physics.
OpponentCheating=0
; Only used with OpponentCheating=1: how long (ms) an opponent must be out of range first.
CheatDelayMs=3000

[Gamepad]
; Game controllers through SDL: Xbox, PlayStation, Switch and most other pads, all with the same
; layout, plugged in or out at any time. Needs a 32-bit SDL3.dll or SDL2.dll next to
; CARMA2_HW.EXE (from libsdl.org); without one, joysticks work as before. The pad is joystick
; "SDL: <name>": the left stick steers, the right trigger accelerates and the left trigger
; brakes/reverses. In the controls menu its buttons are Joy 1 B1 A, B2 B, B3 X, B4 Y, B5 Back,
; B6 Guide, B7 Start, B8/B9 stick clicks, B10 LB, B11 RB, B12-B15 D-pad up/down/left/right,
; B16 Share/Capture, B17-B20 paddles, B21 touchpad, B22 LT, B23 RT.
Enabled=1
; Throttle and brake: 0 = triggers, 1 = left stick up/down, 2 = either.
Throttle=0
; Dead zones, in percent of stick or trigger travel.
StickDeadzone=15
TriggerDeadzone=5
; 1 = the game sees only the SDL pad, not the same controllers again through DirectInput.
; Leave at 0 if you also use a wheel or a joystick that SDL doesn't treat as a gamepad.
HideDirectInputJoysticks=0
; The pad works the menus: D-pad or left stick to move, A or Start to select, B to go back;
; Start pauses a race. 0 = its buttons are only joystick buttons.
MenuControls=1
; 1 = pad buttons drive the race with a Carmageddon: Max Damage layout, added alongside the
; keyboard (it doesn't change your keyboard bindings, and follows any you set in Configure
; Controls): B hand brake, X repair, Y recover, A use power-up, LB/RB previous/next power-up,
; left-stick click horn, right-stick click map, D-pad left/up/right buy Armour/Power/Offense.
; (Accelerate, brake and steer are the triggers and left stick, as above.) 0 = buttons are only
; Joy 1 Bn, to bind yourself in Configure Controls.
ButtonActions=1
; Rumble strength in percent (0 = off): crashes (harder hits rumble more), power-ups such as
; mines, oil, jumps and the afterburner, and the instant handbrake.
Rumble=100
; How hard a hit gives full rumble. Scraping along a wall is about 0.1, a solid crash 1 or more.
ImpactScale=1.5
