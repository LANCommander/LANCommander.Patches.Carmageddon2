; c2patch for Carmageddon II (GOG CARMA2_HW.EXE). Install: copy dinput.dll and this file
; next to CARMA2_HW.EXE. Uninstall: delete them. c2patch.log shows what was applied.

[General]
Enabled=1

[Render]
; Track columns (scenery and objects in them) are drawn out to Yon * YonFactor. The graphics
; menu offers 1.0 / 0.5 / 0.25 / 0.125; this is the lowest value it will be allowed to set.
; 0 = don't touch.
MinYonFactor=1.0
; Lowest far-clip distance (OPTIONS.TXT "Yon"; the menu goes 20..35, the game floor is 5).
; 0 = don't touch. Higher values show more of the track but cost frame rate.
MinYon=0
; Moving scenery (gates, doors, lifts, ...) normally stops animating when it is out of view,
; and keeps colliding wherever it stopped. 1 = always animate.
AnimateAllGrooves=1

[Net]
; Fixes a crash in network games with 8 or more players: when 8 cars take crush damage in the
; same frame, the game's damage list loses its end marker and the game reads garbage.
FixCrushListOverflow=1
; How often this machine sends car positions, in ms. The game simulates in 40 ms steps, so:
; 40 = 25 updates/s, 80 = 12.5/s (the original), 120 = 8.3/s. Faster is smoother but uses more
; bandwidth; the host's setting decides how often everyone sees the other players. Also on the
; NET GAME OPTIONS screen as UPDATE RATE (25 HZ / 12 HZ / 8 HZ), which saves here.
SendIntervalMs=80
; 0 hides the UPDATE RATE row from NET GAME OPTIONS.
UpdateRateMenu=1
; The original game also resends unchanged car data on frames where no new 40 ms simulation step
; has happened, which at modern frame rates more than doubles the traffic (about 30 packets/s
; at 60 fps for 12.5 real updates). 1 = skip those duplicates.
SkipDuplicateSends=1

[Player]
; Longest driver name you can type (the original allows 8). 13 is the most the game's save
; files and memory layout can hold.
MaxNameLength=13

[AI]
; Opponents more than ~45 units from you for 3 s stop being simulated: they are hidden and slid
; along the path network without collision, then rematerialise when you get close (which is how
; they end up stuck behind barriers). 0 = opponents always use full physics.
OpponentCheating=0
; Only used with OpponentCheating=1: how long (ms) an opponent must be out of range first.
CheatDelayMs=3000
