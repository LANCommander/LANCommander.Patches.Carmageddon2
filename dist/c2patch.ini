; c2patch for Carmageddon II (GOG CARMA2_HW.EXE). Install: copy dinput.dll and this file
; next to CARMA2_HW.EXE. Uninstall: delete them. c2patch.log shows what was applied.

[General]
Enabled=1

[Render]
; Track columns (scenery and objects in them) are drawn out to Yon * YonFactor. The graphics
; menu offers 1.0 / 0.5 / 0.25 / 0.125; this is the lowest value it will be allowed to set.
; 0 = don't touch.
MinYonFactor=1.0
; Lowest far-clip distance (OPTIONS.TXT "Yon"; the menu goes 20..35, the game floor is 5).
; 0 = don't touch. Higher values show more of the track but cost frame rate.
MinYon=0
; Moving scenery (gates, doors, lifts, ...) normally stops animating when it is out of view,
; and keeps colliding wherever it stopped. 1 = always animate.
AnimateAllGrooves=1

[AI]
; Opponents more than ~45 units from you for 3 s stop being simulated: they are hidden and slid
; along the path network without collision, then rematerialise when you get close (which is how
; they end up stuck behind barriers). 0 = opponents always use full physics.
OpponentCheating=0
; Only used with OpponentCheating=1: how long (ms) an opponent must be out of range first.
CheatDelayMs=3000
